<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Docs Viewer</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: #111;
      background: #fff;
    }
    header {
      box-sizing: border-box;
      padding: 12px 16px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    h1 {
      font-size: 16px;
      margin: 0;
      font-weight: 600;
    }
    .spacer {
      flex: 1;
    }
    label {
      font-size: 14px;
    }
    select {
      font-size: 14px;
      padding: 6px 8px;
    }
    main {
      height: calc(100vh - 58px);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    .note {
      font-size: 12px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <header>
    <h1>Docs Viewer</h1>
    <div class="spacer"></div>
    <label for="fileSelect">Choose file:</label>
    <select id="fileSelect" aria-label="Choose HTML file to view">
    </select>
    <input id="filterInput" type="search" placeholder="Filter files..." aria-label="Filter files">
    <button id="refreshBtn" type="button" aria-label="Refresh file list">Refresh</button>
    <div class="spacer"></div>
    <span class="note">Tip: share links like ?page=...</span>
  </header>
  <main>
    <iframe id="viewer" src="" title="HTML preview"></iframe>
  </main>

  <script>
    (async function () {
      const selectEl = document.getElementById('fileSelect');
      const iframeEl = document.getElementById('viewer');
      const noteEl = document.querySelector('.note');
      const filterEl = document.getElementById('filterInput');
      const refreshBtn = document.getElementById('refreshBtn');
      let allPages = [];
      // Hardcoded fallback in case pages.json is unavailable (e.g., opened via file://)
      const fallbackPages = [
        'EB_weight_matrix.html',
        'EB_fig2_zoomed_patches.html',
        'EB_matrix_W_top_10_matches_ncc.html',
        'EB_sorted_matrix_W.html',
        'FB_weight_matrix.html',
        'FB_fig2_zoomed_patches.html',
        'FB_matrix_W_top_10_matches_ncc.html',
        'FB_sorted_matrix_W.html',
        'PB_weight_matrix.html',
        'PB_fig2_zoomed_patches.html',
        'PB_matrix_W_top_10_matches_ncc.html',
        'PB_sorted_matrix_W.html',
        'NO_weight_matrix.html',
        'NO_fig2_zoomed_patches.html',
        'NO_matrix_W_top_10_matches_ncc.html',
        'NO_matrix_W_top_10_matches_ncc_PEN.html',
        'NO_sorted_matrix_W.html',
        'matrix_W_top_10_matches_ncc.html'
      ];

      function naturalSort(a, b) {
        return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
      }

      // Attempt to infer GitHub repo info from GitHub Pages URL
      function detectGitHubRepoInfo() {
        const host = window.location.host || '';
        const path = window.location.pathname || '/';
        if (!host.endsWith('github.io')) return null;
        const user = host.replace(/\.github\.io$/, '');
        const segs = path.split('/').filter(Boolean);
        // Project Pages: https://user.github.io/repo/...
        if (segs.length >= 1) {
          const repo = segs[0];
          return { user, repo, isUserSite: false };
        }
        // User/Org Pages: https://user.github.io/ (served from user.github.io repo)
        return { user, repo: `${user}.github.io`, isUserSite: true };
      }

      // List files via GitHub REST API if on GitHub Pages
      async function loadPagesFromGitHub() {
        const info = detectGitHubRepoInfo();
        if (!info) return null;
        const repo = info.repo;
        const user = info.user;
        // Try common branches in order
        const branches = ['main', 'master', 'gh-pages'];
        // When publishing from /docs on default branch, files live under /docs in repo.
        // When using gh-pages branch (project pages), files often live at repo root.
        const candidatePaths = ['docs', ''];
        for (const branch of branches) {
          for (const sub of candidatePaths) {
            const apiUrl = `https://api.github.com/repos/${encodeURIComponent(user)}/${encodeURIComponent(repo)}/contents/${sub}?ref=${encodeURIComponent(branch)}`;
            try {
              const res = await fetch(apiUrl, { headers: { 'Accept': 'application/vnd.github+json' } });
              if (!res.ok) continue;
              const items = await res.json();
              if (!Array.isArray(items)) continue;
              const names = items
                .filter(it => it && it.type === 'file' && typeof it.name === 'string' && it.name.endsWith('.html') && it.name !== 'index.html')
                .map(it => it.name)
                .sort(naturalSort);
              if (names.length) return names;
            } catch (e) {
              // ignore and try next
            }
          }
        }
        return null;
      }

      async function loadPagesFromManifest() {
        try {
          const res = await fetch('pages.json', { cache: 'no-cache' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const arr = await res.json();
          if (!Array.isArray(arr)) throw new Error('Invalid manifest');
          const filtered = arr
            .filter(name => typeof name === 'string' && name.endsWith('.html') && name !== 'index.html');
          // Natural-ish sort
          filtered.sort(naturalSort);
          return filtered.length ? filtered : fallbackPages;
        } catch (err) {
          console.warn('Could not load pages.json:', err);
          return fallbackPages;
        }
      }

      function populateSelect(pagesToShow, preserveSelection = true) {
        const current = preserveSelection ? selectEl.value : null;
        while (selectEl.firstChild) selectEl.removeChild(selectEl.firstChild);
        for (const name of pagesToShow) {
          const opt = document.createElement('option');
          opt.value = name;
          opt.textContent = name;
          selectEl.appendChild(opt);
        }
        if (preserveSelection && current && pagesToShow.includes(current)) {
          selectEl.value = current;
        }
      }

      function getFilteredPages() {
        const q = (filterEl?.value || '').trim().toLowerCase();
        if (!q) return allPages.slice();
        return allPages.filter(n => n.toLowerCase().includes(q));
      }

      function setPage(page) {
        if (!page) return;
        if (!allPages.includes(page)) {
          if (typeof page === 'string' && page.endsWith('.html') && page !== 'index.html') {
            allPages.push(page);
            allPages.sort(naturalSort);
            populateSelect(getFilteredPages(), true);
          } else {
            return;
          }
        }
        selectEl.value = page;
        iframeEl.src = page;
        const url = new URL(window.location.href);
        url.searchParams.set('page', page);
        history.replaceState(null, '', url);
      }

      selectEl.addEventListener('change', function (e) {
        setPage(e.target.value);
      });

      if (filterEl) {
        filterEl.addEventListener('input', function () {
          populateSelect(getFilteredPages(), true);
        });
      }

      async function refreshList() {
        const current = selectEl.value;
        // Prefer GitHub API when available
        allPages = (await loadPagesFromGitHub()) || (await loadPagesFromManifest());
        const params = new URLSearchParams(window.location.search);
        const paramPage = params.get('page');
        if (paramPage && paramPage.endsWith('.html') && paramPage !== 'index.html' && !allPages.includes(paramPage)) {
          allPages.push(paramPage);
          allPages.sort(naturalSort);
        }
        populateSelect(getFilteredPages(), true);
        if (noteEl && allPages.length) {
          noteEl.textContent = 'Tip: share links like ?page=' + allPages[0];
        }
        if (current && allPages.includes(current)) {
          selectEl.value = current;
        }
      }

      if (refreshBtn) {
        refreshBtn.addEventListener('click', function () {
          refreshList();
        });
      }

      // Initial load
      allPages = (await loadPagesFromGitHub()) || (await loadPagesFromManifest());
      const params = new URLSearchParams(window.location.search);
      const initial = params.get('page');
      if (initial && initial.endsWith('.html') && initial !== 'index.html' && !allPages.includes(initial)) {
        allPages.push(initial);
        allPages.sort(naturalSort);
      }
      populateSelect(getFilteredPages(), false);
      const first = allPages[0];
      setPage(initial && allPages.includes(initial) ? initial : first);
      if (noteEl && first) {
        noteEl.textContent = 'Tip: share links like ?page=' + first;
      }
    })();
  </script>
</body>
</html>
