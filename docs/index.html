<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Docs Viewer</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: #111;
      background: #fff;
    }
    header {
      box-sizing: border-box;
      padding: 12px 16px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    h1 {
      font-size: 16px;
      margin: 0;
      font-weight: 600;
    }
    .spacer {
      flex: 1;
    }
    label {
      font-size: 14px;
    }
    select {
      font-size: 14px;
      padding: 6px 8px;
    }
    main {
      height: calc(100vh - 58px);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    .note {
      font-size: 12px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <header>
    <h1>Docs Viewer</h1>
    <div class="spacer"></div>
    <label for="fileSelect">Choose file:</label>
    <select id="fileSelect" aria-label="Choose HTML file to view">
      <option value="sorted_matrix_W.html">sorted_matrix_W.html</option>
      <option value="fig2_zoomed_patches.html">fig2_zoomed_patches.html</option>
    </select>
    <div class="spacer"></div>
    <span class="note">Tip: share links like ?page=fig2_zoomed_patches.html</span>
  </header>
  <main>
    <iframe id="viewer" src="sorted_matrix_W.html" title="HTML preview"></iframe>
  </main>

  <script>
    (function () {
      const selectEl = document.getElementById('fileSelect');
      const iframeEl = document.getElementById('viewer');

      function setPage(page) {
        if (!page) return;
        const allowed = new Set(['sorted_matrix_W.html', 'fig2_zoomed_patches.html']);
        if (!allowed.has(page)) return;
        selectEl.value = page;
        iframeEl.src = page;
        const url = new URL(window.location.href);
        url.searchParams.set('page', page);
        history.replaceState(null, '', url);
      }

      selectEl.addEventListener('change', function (e) {
        setPage(e.target.value);
      });

      const params = new URLSearchParams(window.location.search);
      const initial = params.get('page');
      if (initial) {
        setPage(initial);
      }
    })();
  </script>
</body>
</html>
