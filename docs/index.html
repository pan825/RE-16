<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Docs Viewer</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: #111;
      background: #fff;
    }
    header {
      box-sizing: border-box;
      padding: 12px 16px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    h1 {
      font-size: 16px;
      margin: 0;
      font-weight: 600;
    }
    .spacer {
      flex: 1;
    }
    label {
      font-size: 14px;
    }
    select {
      font-size: 14px;
      padding: 6px 8px;
    }
    main {
      height: calc(100vh - 58px);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    .note {
      font-size: 12px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <header>
    <h1>Docs Viewer</h1>
    <div class="spacer"></div>
    <label for="fileSelect">Choose file:</label>
    <select id="fileSelect" aria-label="Choose HTML file to view">
    </select>
    <div class="spacer"></div>
    <span class="note">Tip: share links like ?page=...</span>
  </header>
  <main>
    <iframe id="viewer" src="" title="HTML preview"></iframe>
  </main>

  <script>
    (async function () {
      const selectEl = document.getElementById('fileSelect');
      const iframeEl = document.getElementById('viewer');
      const noteEl = document.querySelector('.note');
      // Hardcoded fallback in case pages.json is unavailable (e.g., opened via file://)
      const fallbackPages = [
        'EB_weight_matrix.html',
        'EB_fig2_zoomed_patches.html',
        'EB_matrix_W_top_10_matches_ncc.html',
        'EB_sorted_matrix_W.html',
        'PB_matrix_W_top_10_matches_ncc.html',
        'PB_sorted_matrix_W.html',
        'matrix_W_top_10_matches_ncc.html'
      ];

      async function loadPagesFromManifest() {
        try {
          const res = await fetch('pages.json', { cache: 'no-cache' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const arr = await res.json();
          if (!Array.isArray(arr)) throw new Error('Invalid manifest');
          const filtered = arr
            .filter(name => typeof name === 'string' && name.endsWith('.html') && name !== 'index.html');
          // Natural-ish sort
          filtered.sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));
          return filtered.length ? filtered : fallbackPages;
        } catch (err) {
          console.warn('Could not load pages.json:', err);
          return fallbackPages;
        }
      }

      const pages = await loadPagesFromManifest();

      // Populate selector
      for (const name of pages) {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        selectEl.appendChild(opt);
      }

      function setPage(page) {
        if (!page) return;
        if (!pages.includes(page)) return;
        selectEl.value = page;
        iframeEl.src = page;
        const url = new URL(window.location.href);
        url.searchParams.set('page', page);
        history.replaceState(null, '', url);
      }

      selectEl.addEventListener('change', function (e) {
        setPage(e.target.value);
      });

      const params = new URLSearchParams(window.location.search);
      const initial = params.get('page');
      const first = pages[0];
      setPage(initial && pages.includes(initial) ? initial : first);
      if (noteEl && first) {
        noteEl.textContent = 'Tip: share links like ?page=' + first;
      }
    })();
  </script>
</body>
</html>
